<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ · Import Export Control</title>
<style>
:root{color-scheme:light dark;--page:#f4f6f8;--card:#fff;--text:#192b32;--muted:#63757b;--line:#d9e2e5;--brand:#13775d}
@media(prefers-color-scheme:dark){:root{--page:#101b20;--card:#17262d;--text:#edf4f4;--muted:#abbcc1;--line:#35474f;--brand:#269b7d}}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--page);color:var(--text);font:15px system-ui,sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 16px 60px #142c3510}h1{font-size:25px;margin:8px 0}p{color:var(--muted);line-height:1.65}.brand{font-size:12px;letter-spacing:1.5px;color:var(--brand);font-weight:600}label{display:block;margin:20px 0 7px}input{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--text);padding:10px 12px;font:inherit}input:focus-visible,button:focus-visible{outline:3px solid #4db89c;outline-offset:2px}button{font:inherit;cursor:pointer}.submit{margin-top:22px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--brand);color:#fff}.submit:disabled{opacity:.6;cursor:wait}.show{margin-top:8px;border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0}.note{font-size:12px;border-top:1px solid var(--line);padding-top:18px;margin-bottom:0}#error{color:#c34949;line-height:1.6;min-height:0}#notice{font-size:13px}
</style>
</head>
<body><main class="card">
<div class="brand">IMPORT EXPORT CONTROL</div><h1>เข้าสู่ระบบ</h1>
<p>ติดตามงานนำเข้า–ส่งออกและต้นทุนในที่เดียว</p>
<p id="notice" role="status"></p>
<form id="loginForm">
<label for="username">ชื่อผู้ใช้ (Username)</label><input id="username" name="username" autocomplete="username" maxlength="120" required autofocus>
<label for="password">รหัสผ่าน (Password)</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
<button class="show" id="showPassword" type="button" aria-pressed="false">แสดงรหัสผ่าน</button>
<p id="error" role="alert"></p><button class="submit" id="submit" type="submit">เข้าสู่ระบบ</button>
</form>
<p class="note">ใช้บัญชีเดิมที่ได้รับจากผู้ดูแล · บัญชี Viewer ดูข้อมูลได้อย่างเดียว<br>ระบบจะออกจากระบบเมื่อไม่มีการใช้งาน 30 นาที</p>
</main>
<script>
const form=document.getElementById('loginForm'),pass=document.getElementById('password'),error=document.getElementById('error'),submit=document.getElementById('submit');
const params=new URLSearchParams(location.search);
document.getElementById('notice').textContent=params.get('reason')==='expired'?'หมดเวลาใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง':params.get('reason')==='logout'?'ออกจากระบบแล้ว':'';
document.getElementById('showPassword').onclick=function(){const show=pass.type==='password';pass.type=show?'text':'password';this.textContent=show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน';this.setAttribute('aria-pressed',String(show));};
form.onsubmit=async function(event){event.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='กำลังเข้าสู่ระบบ…';
 try{const response=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-control-request':'1'},body:JSON.stringify({username:form.username.value,password:pass.value,next:params.get('next')||'/'})});
 const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'เข้าสู่ระบบไม่สำเร็จ');pass.value='';location.replace(result.next||'/');
 }catch(e){error.textContent=e instanceof TypeError?'เชื่อมต่อไม่ได้ กรุณาลองใหม่':e.message;submit.disabled=false;submit.textContent='เข้าสู่ระบบ';}
};
</script></body></html>
