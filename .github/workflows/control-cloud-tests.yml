name: Control Cloud tests

# Source-only checks. Production deployment is a separately gated release command.
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-cloud-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated browser runtime
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Isolated API, finance, browser, packing and restore tests
        run: npm run test:full
      - name: Build the actual Linux release image
        run: docker build -t control-cloud-ci .
      - name: Exercise image entrypoint, private persistence and restart
        run: >-
          docker run --rm --network none -e TEST_APP_ROOT=/app
          --mount "type=bind,src=${{ github.workspace }}/tests/deployment-runtime.cjs,dst=/tmp/deployment-runtime.cjs,readonly"
          control-cloud-ci node /tmp/deployment-runtime.cjs
