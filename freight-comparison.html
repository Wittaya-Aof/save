<head>

<script>
// หน้านี้ถูกเปิดเป็น iframe ในแอปหลัก (เหมือน container-loading-calculator.html) — รับธีมจาก
// localStorage.kobTheme ที่แอปหลักตั้งไว้ และตามการสลับธีมสดผ่าน storage event
(function(){
  var apply=function(v){
    if(v==='dark'||v==='light')document.documentElement.setAttribute('data-theme',v);
    else document.documentElement.removeAttribute('data-theme');
  };
  try{apply(localStorage.getItem('kobTheme'));}catch(e){}
  window.addEventListener('storage',function(e){if(e.key==='kobTheme')apply(e.newValue);});
  if(window.self!==window.top)document.documentElement.classList.add('embedded');
})();
</script>
<style>
/* Design tokens — ชุดเดียวกับ import-export-os.html / container-loading-calculator.html (Supabase) */
:root{
  --color-text:#171717; --color-text-secondary:#212121; --color-text-tertiary:#707070; --color-text-muted:#9a9a9a;
  --color-surface:#ffffff; --color-surface-muted:#fafafa; --color-surface-muted2:#ededed; --color-page-bg:#ffffff;
  --color-border:#dfdfdf; --color-border-strong:#c7c7c7;
  --color-brand:#3ecf8e; --color-brand-deep:#24b47e; --color-brand-soft-green:#4ade80;
  --color-on-brand:#171717;
  --color-brand-soft:#fafafa; --color-brand-text:#171717;
  --color-danger:#d45656; --color-success:#1ba673; --color-warn:#c37d0d;
  --color-danger-soft:rgba(212,86,86,.12); --color-success-soft:rgba(27,166,115,.12); --color-warn-soft:rgba(195,125,13,.12);
  --color-danger-border:rgba(212,86,86,.32); --color-success-border:rgba(27,166,115,.32); --color-warn-border:rgba(195,125,13,.32);
  --color-danger-text:#b23c3c; --color-success-text:#12805a; --color-warn-text:#8a5808;
  --color-input:#fffbe6; /* ช่องกรอกราคา = พื้นเหลืองอ่อนเหมือน "yellow cells" ใน Excel ต้นฉบับ */
  --radius-xs:4px; --radius-sm:6px; --radius:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-pill:9999px;
  --shadow-card:none; --shadow-pop:0 16px 40px -8px rgba(23,23,23,.18);
  --font-body:'Inter','Noto Sans Thai',system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,Menlo,Monaco,Consolas,'Liberation Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --color-text:#ffffff; --color-text-secondary:#d4d4d4; --color-text-tertiary:#9a9a9a; --color-text-muted:#707070;
    --color-surface:#1c1c1e; --color-surface-muted:#202020; --color-surface-muted2:#2a2a2a; --color-page-bg:#171717;
    --color-border:#2a2a2a; --color-border-strong:#3a3a3a;
    --color-brand-soft:#202020; --color-brand-text:#4ade80;
    --color-danger-text:#f08a8a; --color-success-text:#4ddba8; --color-warn-text:#e0a53c;
    --color-input:#2a2714;
    --shadow-pop:0 16px 40px -8px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --color-text:#ffffff; --color-text-secondary:#d4d4d4; --color-text-tertiary:#9a9a9a; --color-text-muted:#707070;
  --color-surface:#1c1c1e; --color-surface-muted:#202020; --color-surface-muted2:#2a2a2a; --color-page-bg:#171717;
  --color-border:#2a2a2a; --color-border-strong:#3a3a3a;
  --color-brand-soft:#202020; --color-brand-text:#4ade80;
  --color-danger-text:#f08a8a; --color-success-text:#4ddba8; --color-warn-text:#e0a53c;
  --color-input:#2a2714;
  --shadow-pop:0 16px 40px -8px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);font-weight:400;-webkit-font-smoothing:antialiased;background:var(--color-page-bg);color:var(--color-text);font-size:14px}
.header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:12px 22px}
.header h1{margin:0;font-size:17px;font-weight:500}
.header p{margin:2px 0 0;font-size:12.5px;color:var(--color-text-tertiary)}
.embedded .header{display:none}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;background:var(--color-surface);border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:5}
/* ตัวเลือกแม่แบบ = สวิตช์หลักของทั้งโมดูล เดิมดูเหมือนตัวกรองเล็ก ๆ จนไม่มีใครสังเกตว่ากดได้
   จึงทำให้เด่นขึ้นด้วย: มีป้ายกำกับ · ปุ่มใหญ่ขึ้น · มีไอคอนโหมดขนส่ง · ตัวที่เลือกเป็นพื้นทึบตัดกันสูง
   ⚠ ไม่ใช้เขียว emerald ตรงนี้ เพราะธีมสงวนไว้ให้ปุ่ม CTA (บันทึก) เป็นสีเดียวในหน้า
   ถ้าใส่เขียวสองที่ในแถบเดียวกันจะกลายเป็นแย่งความสนใจกันเองแทนที่จะเน้น */
.segwrap{display:inline-flex;align-items:center;gap:8px}
/* ใช้ ink-mute (4.95) ไม่ใช่ ink-mute-2 (2.81) — ป้ายนี้ต้องอ่านออก ไม่ใช่ caption จาง ๆ */
.seglbl{font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-tertiary);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--color-border-strong);border-radius:var(--radius);overflow:hidden;background:var(--color-surface-muted)}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0 14px;height:36px;font:inherit;font-size:13px;font-weight:500;color:var(--color-text-tertiary);cursor:pointer;border-right:1px solid var(--color-border);white-space:nowrap;transition:background .12s,color .12s}
.seg button:last-child{border-right:0}
.seg button svg{width:15px;height:15px;flex:none}
.seg button:hover:not(.on){background:var(--color-surface);color:var(--color-text)}
.seg button.on{background:var(--color-text);color:var(--color-page-bg)}
.seg button:focus-visible{outline:2px solid var(--color-text);outline-offset:-2px}
.spacer{flex:1}
/* กว้างเต็มหน้าต่าง (มีเพดานกันจอ ultrawide) — เดิมคาไว้ที่ 1240px ทำให้ตารางเลื่อนแนวนอน
   ทั้งที่หน้าจอยังเหลือที่ว่างอีกหลายร้อย px ทางขวา */
.content{width:100%;max-width:1720px;margin:14px auto;padding:0 20px 32px}
@media (max-width:900px){.content{padding:0 12px 24px}}
.btn{padding:0 14px;height:32px;border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--color-brand);color:var(--color-on-brand)}.btn-primary:hover{filter:brightness(1.08)}
.btn-outline{background:var(--color-surface);color:var(--color-text-secondary);border:1px solid var(--color-border)}
.btn-outline:hover{background:var(--color-surface-muted)}
.btn-danger{background:var(--color-danger-soft);color:var(--color-danger-text);border:1px solid var(--color-danger-border)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden}
.card-header{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--color-border);font-size:11.5px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--color-text-tertiary)}
.card-body{padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 14px}
@media (max-width:1450px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1080px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field label{display:block;font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px}
.field .row{display:flex;gap:6px;align-items:center}
.field .unit{font-size:11.5px;color:var(--color-text-muted);white-space:nowrap}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);height:32px;padding:0 9px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--color-border-strong);box-shadow:0 0 0 2px rgba(23,23,23,.08)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
input.price{background:var(--color-input)}
input.inline{height:26px;padding:0 6px;font-size:12.5px}
/* คอลัมน์ต้องไม่ถูกบีบจนตัดคำ — กว้างเกินให้เลื่อนแนวนอนใน .card แทน
   min-width ตั้งให้พอดี 3 ตัวเลือก (แม่แบบมาตรฐาน) ที่ความกว้างหน้าจอทั่วไป จึงไม่ต้องเลื่อน */
table{width:100%;min-width:1020px;border-collapse:collapse;font-size:13px}
th.col-unit,td.col-unit{min-width:68px}th.col-cur,td.col-cur{min-width:70px}
th{background:var(--color-page-bg);padding:8px;text-align:left;font-weight:500;color:var(--color-text-muted);font-size:11px;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--color-border);vertical-align:bottom}
td{padding:5px 8px;border-bottom:1px solid var(--color-border);color:var(--color-text);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.amt{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}
tr.sec td{background:var(--color-surface-muted);font-weight:500;font-size:12px;color:var(--color-text-secondary);padding:7px 10px}
tr.total td{font-weight:500;border-top:2px solid var(--color-border-strong)}
tr.grand td{font-weight:500;background:var(--color-surface-muted)}
td.best{color:var(--color-success-text);font-weight:500}
.tag{display:inline-block;padding:1px 7px;border-radius:var(--radius-pill);font-size:10.5px;font-weight:500;white-space:nowrap}
select.inline{padding-right:16px;min-width:58px}
#savedSel{min-width:220px;max-width:340px;text-overflow:ellipsis}
@media (max-width:1500px){.status{display:none}}
.tag-best{background:var(--color-success-soft);color:var(--color-success-text);border:1px solid var(--color-success-border)}
.tag-warn{background:var(--color-warn-soft);color:var(--color-warn-text);border:1px solid var(--color-warn-border)}
.warnbar{display:flex;gap:8px;align-items:flex-start;margin:0 0 12px;padding:9px 12px;border-radius:var(--radius-md);background:var(--color-warn-soft);border:1px solid var(--color-warn-border);color:var(--color-warn-text);font-size:12.5px;line-height:1.45}
.warnbar b{font-weight:500}
/* หัวคอลัมน์ตัวเลือกต้องชิดบนเสมอ — ถ้าปล่อยเป็น vertical-align:bottom ตามค่าปกติของ th
   คอลัมน์ที่มีป้ายกำกับ (ถูกที่สุด / ยังกรอกไม่ครบ) จะสูงกว่าเพื่อน แล้วชื่อคอลัมน์ไม่ตรงแนวกัน */
th.opt-th{vertical-align:top}
.opt-head{display:flex;flex-direction:column;gap:4px;min-width:174px}
.opt-head .r{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
/* ช่องชื่อคอลัมน์ต้องยอมหด ไม่งั้นมันกิน 100% แล้วดันปุ่มลบ (×) ตกไปบรรทัดถัดไป */
.opt-head .r>input.inline{flex:1 1 60px;min-width:0;width:auto}
.opt-head input,.opt-head select{height:26px;font-size:12px;padding:0 6px}
/* ปล่อยให้ select กว้างตามตัวเลือกที่ยาวสุด ("FCL 40'HQ") ไม่งั้นข้อความถูกตัดเป็น "FCL 20'G"
   แล้วชดเชยด้วยการหดช่องตัวเลข (จำนวนตู้ 1-99 / น้ำหนักคิดเงิน) เพื่อไม่ให้ตารางกว้างขึ้น */
.opt-head .kind{width:auto;flex:none;padding-right:20px}
.opt-head .n{width:52px;flex:none}
.opt-head .lbl{font-size:10.5px;color:var(--color-text-muted);white-space:nowrap}
.desc{border:0;background:transparent;height:26px;padding:0 4px;width:100%}
.desc:focus{background:var(--color-surface-muted)}
.x{border:0;background:transparent;color:var(--color-text-muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 6px;border-radius:var(--radius-xs)}
.x:hover{color:var(--color-danger-text);background:var(--color-danger-soft)}
.muted{color:var(--color-text-muted);font-size:12px}
.note{font-size:12px;color:var(--color-text-tertiary);padding:8px 16px 12px;border-top:1px dashed var(--color-border)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--color-text);color:var(--color-page-bg);padding:9px 14px;border-radius:var(--radius);font-size:12.5px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--color-danger)}
.status{font-size:11.5px;color:var(--color-text-muted);white-space:nowrap}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sum{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 12px}
.sum.best{border-color:var(--color-success-border);background:var(--color-success-soft)}
.sum.warn{border-color:var(--color-warn-border);background:var(--color-warn-soft)}
.sum .t{font-size:11.5px;color:var(--color-text-tertiary);display:flex;justify-content:space-between;gap:6px}
.sum .v{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.sum .s{font-size:11.5px;color:var(--color-text-muted);margin-top:2px}
@media print{
  .toolbar,.header,.x,.btn,.no-print{display:none!important}
  .content{max-width:none;margin:0;padding:0}
  .card{break-inside:avoid;border-color:#999}
  input,select{border:0;background:transparent!important;padding:0}
  body{font-size:12px}
}
</style>
</head>

<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// แม่แบบรายการค่าใช้จ่าย — ยกมาจาก Excel ทั้ง 3 ชีท (SEA (LCL·FCL) / AIR FREIGHT / Format)
// basis: 'cbm' = คูณ CBM (LCL) หรือคูณจำนวนตู้ (FCL) · 'kgs' = คูณน้ำหนักคิดเงินของคอลัมน์นั้น · 'flat' = qty × ราคา
// ─────────────────────────────────────────────────────────────────────────────
const R=(desc,basis,unit,cur)=>({desc,basis,unit,cur,qty:1});
const TEMPLATES={
  'import-sea':{
    title:'IMPORT FREIGHT PRICE COMPARISON — SEA',
    refLabel:'PO Number', partyLabel:'Vendor', termOptions:['EXW','FOB','CFR','CIF','DAP','DDP'],
    // ชื่อคอลัมน์เว้นว่างไว้ให้ผู้ใช้พิมพ์ชื่อ Freight Forwarder ที่จะเปรียบเทียบ (ชนิดตู้อยู่ที่ dropdown ด้านล่าง)
    options:[{label:'',kind:'lcl'},{label:'',kind:'fcl20'},{label:'',kind:'fcl40hq'}],
    sections:[
      {name:'OCEAN FREIGHT',rows:[R('O/F  (Ocean Freight)','cbm','CBM','USD')]},

// แถวมาตรฐานของแม่แบบต้องมีครบเสมอ — ก่อนหน้านี้ปุ่ม × ลบแถวได้ทุกแถวและลบแล้วหายถาวร
// (ไม่มี undo ไม่มีที่เก็บ) ใบที่ลบ "O/F Ocean Freight" หรือ "EXW Charge" ทิ้งไปจะเทียบราคาขาดไปเงียบ ๆ
// จึงเติมแถวที่หายกลับตามลำดับของแม่แบบ โดยรักษาราคาและข้อความที่ผู้ใช้แก้ไว้ของแถวที่ยังอยู่
function ensureTemplateRows(q){
  const T=TEMPLATES[q.type]; if(!T)return q;
  const old=Array.isArray(q.rows)?q.rows.slice():[], used=new Set(), out=[];
  const n=(q.options||[]).length;
  const key=s=>String(s??'').trim().toLowerCase();
  T.sections.forEach(s=>{
    s.rows.forEach(tr=>{
      const tk=s.name+'|'+tr.desc;
      // จับคู่ด้วย tkey ก่อน — ผู้ใช้แก้ชื่อรายการได้ ถ้าจับคู่ด้วยชื่อจะกลายเป็นว่าแถวนั้นหาย
      // แล้วแทรกแถวแม่แบบซ้ำเข้ามาอีกใบ · ใบเก่าที่ยังไม่มี tkey ค่อยถอยไปเทียบชื่อแล้วติดคีย์ให้
      let i=old.findIndex((r,idx)=>!used.has(idx)&&r.tkey===tk);
      if(i<0)i=old.findIndex((r,idx)=>!used.has(idx)&&!r.tkey&&key(r.section)===key(s.name)&&key(r.desc)===key(tr.desc));
      if(i>=0){ used.add(i); old[i].tpl=true; old[i].tkey=tk; old[i].section=s.name; out.push(old[i]); }
      else out.push({id:uid(),tkey:tk,section:s.name,desc:tr.desc,basis:tr.basis,unit:tr.unit,cur:tr.cur,qty:tr.qty,tpl:true,prices:Array(n).fill(null)});
    });
    old.forEach((r,idx)=>{ if(!used.has(idx)&&key(r.section)===key(s.name)){used.add(idx);r.tpl=false;delete r.tkey;r.section=s.name;out.push(r);} }); // แถวที่ผู้ใช้เพิ่มเองในหมวดนี้
  });
  old.forEach((r,idx)=>{ if(!used.has(idx)){r.tpl=false;delete r.tkey;out.push(r);} });   // หมวดที่ไม่ตรงแม่แบบ — เก็บไว้ ไม่ทิ้ง
  q.rows=out;
  return q;
}

// ใบที่บันทึกไว้ก่อนหน้า (หรือ draft เก่า) อาจมีจำนวนคอลัมน์ไม่ตรงกับความยาว prices ของแต่ละแถว
// เช่น เคยลบคอลัมน์ตอนที่ยังเปิดอีกแท็บค้างไว้ → amount() จะอ่าน undefined เงียบๆ แล้วยอดหาย
// จึงปรับความยาวให้ตรงกับ options ทุกครั้งที่รับใบเข้ามา (เติม null / ตัดส่วนเกิน)
function normalizeQuote(q){
  if(!q||typeof q!=='object')return q;
  const air=q.type==='import-air';
  if(!Array.isArray(q.options)||!q.options.length)q.options=[{label:'',kind:air?'air':'lcl',containers:1,cw:null}];
  q.options.forEach(o=>{
    if(o.kind==='fcl')o.kind='fcl20';                                  // ใบเก่าใช้ kind 'fcl' รวมทุกขนาด
    if(!(air?AIR_KINDS:SEA_KINDS).includes(o.kind))o.kind=air?'air':'lcl';
    if(o.label==null)o.label='';
    if(num(o.containers)==null)o.containers=1;
    if(o.cw===undefined)o.cw=null;
    delete o.transit;                                                  // ช่อง transit ถูกถอดออกจากหน้าจอแล้ว
  });
  const n=q.options.length;
  (q.rows||[]).forEach(r=>{
    if(!Array.isArray(r.prices))r.prices=[];
    if(r.prices.length<n)r.prices=r.prices.concat(Array(n-r.prices.length).fill(null));
    else if(r.prices.length>n)r.prices=r.prices.slice(0,n);
  });
  if(num(q.taxFactor)==null)q.taxFactor=0;
  return ensureTemplateRows(q);
}

// ─── คำนวณ (ตรงกับสูตรใน Excel) ─────────────────────────────────────────────
// LCL: แถว CBM = CBM × ราคา · FCL: แถว CBM = จำนวนตู้ × ราคา (ในชีทจริงผู้ใช้กรอกทับสูตรเป็นต่อตู้อยู่แล้ว)
// AIR: แถว KGS = น้ำหนักคิดเงินของคอลัมน์นั้น (default = max(GW,VW)) × ราคา · USD คูณอัตรา BOT
function chargeableW(o){ if(o.cw!=null&&o.cw!=='')return +o.cw; const g=num(Q.head.gw)||0,v=num(Q.head.vw)||0; return Math.max(g,v)||null; }
function qtyFor(row,o){
  if(row.basis==='cbm')return isFcl(o.kind)?(num(o.containers)||1):(num(Q.head.cbm)||null);
  if(row.basis==='kgs')return chargeableW(o);
  return num(row.qty)??1;
}
function amount(row,oi){
  const p=num(row.prices[oi]); if(p==null)return null;
  const q=qtyFor(row,Q.options[oi]); if(q==null)return null;
  const rate=row.cur==='USD'?(num(Q.head.fx)||0):1;
  if(row.cur==='USD'&&!rate)return null;
  return q*p*rate;
}
function totals(){
  return Q.options.map((o,oi)=>{
    let sub=0,filled=0;
    Q.rows.forEach(r=>{const a=amount(r,oi);if(a!=null){sub+=a;filled++;}});
    const tax=sub*(num(Q.taxFactor)||0), total=sub+tax, qty=num(Q.head.qty);
    return {sub,tax,total,filled,avg:qty?total/qty:null};
  });
}
function bestIndex(t){ let bi=-1; t.forEach((x,i)=>{ if(x.filled>0&&(bi<0||x.total<t[bi].total))bi=i; }); return bi; }
// ⚠ ยอดรวมต่ำสุดไม่ได้แปลว่าถูกที่สุดเสมอไป — ถ้าคอลัมน์นั้นกรอกราคาน้อยรายการกว่าคอลัมน์อื่น
// ยอดมันย่อมต่ำกว่าโดยอัตโนมัติ (ค่าที่ยังไม่กรอก = ไม่นับ ไม่ใช่ = 0) การชูป้ายเขียวตรงนั้นคือ
// การชี้นำให้เลือกเจ้าที่ "ยังเสนอราคาไม่ครบ" ซึ่งอันตรายกับการตัดสินใจจริง จึงต้องเตือนให้เห็น
function cmpMeta(t){
  const maxFilled=t.reduce((m,x)=>Math.max(m,x.filled),0);
  const best=bestIndex(t);
  return {maxFilled,best,fair:best<0||t[best].filled>=maxFilled};
}
function bestTag(fair){
  return fair
    ? '<span class="tag tag-best" title="ยอดรวมต่ำสุด และกรอกราคาครบเท่ากับคอลัมน์ที่ครบที่สุด">ถูกที่สุด</span>'
    : '<span class="tag tag-warn" title="ยอดรวมต่ำสุด แต่ยังกรอกราคาน้อยรายการกว่าคอลัมน์อื่น — ยอดจึงต่ำโดยอัตโนมัติ ยังเทียบกันตรงๆ ไม่ได้">ต่ำสุด · ยังกรอกไม่ครบ</span>';
}

function renderTable(){
  const T=TEMPLATES[Q.type], t=totals(), M=cmpMeta(t), best=M.best, air=Q.type==='import-air';
  const nOpt=Q.options.length;
  // ปุ่มลบแถวมีเฉพาะแถวที่ผู้ใช้เพิ่มเอง — แถวมาตรฐานของแม่แบบลบไม่ได้อีกแล้ว (เคยลบแล้วหายถาวร)
  // ถ้ายังไม่มีแถวที่เพิ่มเอง ก็ไม่ต้องมีคอลัมน์ปุ่มลบให้รกตาราง
  const xCol=Q.rows.some(r=>!r.tpl)?1:0;
  // Description กิน % ของความกว้างที่เหลือ เพื่อให้ชื่อรายการยาว ๆ ("CFS (Container Freight Station)")
  // ไม่ถูกตัด เมื่อหน้าต่างกว้างขึ้นคอลัมน์นี้จะกว้างตามแทนที่จะปล่อยให้คอลัมน์ราคากินไปหมด
  let html='<thead><tr><th style="width:30px">No.</th><th style="width:28%;min-width:236px">Description</th><th class="num" style="width:70px">Qty</th><th class="col-unit">Unit</th><th class="col-cur">Cur</th>';
  Q.options.forEach((o,oi)=>{
    html+=`<th class="opt-th" colspan="2" style="min-width:182px"><div class="opt-head">
      <div class="r"><input class="inline" data-p="options.${oi}.label" value="${esc(o.label)}" title="${esc(o.label)}" list="vendorList" placeholder="ชื่อ Freight Forwarder">
        ${nOpt>1?`<button class="x no-print" data-delopt="${oi}" title="ลบคอลัมน์นี้">×</button>`:''}</div>
      <div class="r"><select class="kind" data-p="options.${oi}.kind">${(air?AIR_KINDS:SEA_KINDS).map(k=>`<option value="${k}" ${k===o.kind?'selected':''}>${KIND_LABEL[k]}</option>`).join('')}</select>
        ${isFcl(o.kind)?`<span class="lbl">ตู้</span><input class="n" type="number" min="1" step="1" data-p="options.${oi}.containers" value="${o.containers??1}">`:''}
        ${o.kind==='air'?`<span class="lbl">CW</span><input class="n" type="number" step="any" data-p="options.${oi}.cw" value="${o.cw??''}" placeholder="${fmt(chargeableW(o),1)}" title="น้ำหนักคิดเงิน (ว่าง = max(GW,VW))">`:''}
        ${o.kind==='lcl'?`<span class="lbl">× CBM ${fmt(num(Q.head.cbm),2)}</span>`:''}
        ${best===oi?bestTag(M.fair):''}</div>
    </div></th>`;
  });
  html+=(xCol?'<th class="no-print" style="width:28px"></th>':'')+'</tr>';
  html+='<tr><th></th><th></th><th></th><th></th><th></th>'+Q.options.map(()=>'<th class="num">Price / Unit</th><th class="num">Amount (THB)</th>').join('')+(xCol?'<th class="no-print"></th>':'')+'</tr></thead><tbody>';
  let n=0, curSec=null;
  Q.rows.forEach((r,ri)=>{
    if(r.section!==curSec){curSec=r.section;html+=`<tr class="sec"><td colspan="${5+nOpt*2+xCol}">${esc(curSec)}<button class="x no-print" data-addrow="${esc(curSec)}" title="เพิ่มรายการในหมวดนี้" style="float:right;font-size:12px">+ เพิ่มรายการ</button></td></tr>`;}
    n++;
    html+=`<tr><td class="muted">${n}</td><td><input class="desc" data-p="rows.${ri}.desc" value="${esc(r.desc)}" title="${esc(r.desc)}"></td>`;
    // Qty: แถว CBM/KGS แสดงค่าที่คำนวณต่อคอลัมน์ (ต่างกันได้) จึงโชว์ "ตามคอลัมน์" · แถว flat แก้ได้
    html+=`<td class="num">${r.basis==='flat'?`<input class="inline" type="number" step="any" data-p="rows.${ri}.qty" value="${r.qty??1}" style="width:64px">`:`<select class="inline" data-p="rows.${ri}.basis" style="width:70px"><option value="cbm" ${r.basis==='cbm'?'selected':''}>CBM</option><option value="kgs" ${r.basis==='kgs'?'selected':''}>KGS</option><option value="flat">1</option></select>`}</td>`;
    html+=`<td class="col-unit"><input class="inline" data-p="rows.${ri}.unit" value="${esc(r.unit)}" title="${esc(r.unit)}"></td>`;
    html+=`<td class="col-cur"><select class="inline" data-p="rows.${ri}.cur"><option ${r.cur==='USD'?'selected':''}>USD</option><option ${r.cur==='THB'?'selected':''}>THB</option></select></td>`;
    Q.options.forEach((o,oi)=>{
      const a=amount(r,oi), q=qtyFor(r,o);
      const tip=a!=null?`${fmt(q,r.basis==='cbm'&&!isFcl(o.kind)?3:2)} × ${fmt(num(r.prices[oi]))}${r.cur==='USD'?' × '+fmt(num(Q.head.fx),4):''}`:'';
      html+=`<td class="num"><input class="inline price" type="number" step="any" data-p="rows.${ri}.prices.${oi}" value="${r.prices[oi]??''}" style="width:78px"></td><td class="num amt" title="${tip}">${fmt(a)}</td>`;
    });
    html+=(xCol?`<td class="no-print">${r.tpl?'':`<button class="x" data-delrow="${ri}" title="ลบรายการที่เพิ่มเอง">×</button>`}</td>`:'')+'</tr>';
  });
  html+='</tbody><tfoot>';
  html+=`<tr class="total"><td colspan="5">SUBTOTAL</td>${t.map(x=>`<td></td><td class="num amt">${fmt(x.filled?x.sub:null)}</td>`).join('')}${xCol?'<td class="no-print"></td>':''}</tr>`;
  html+=`<tr><td colspan="5">* As per receipt — factor <input class="inline" type="number" step="0.01" min="0" data-p="taxFactor" value="${num(Q.taxFactor)??''}" style="width:70px;display:inline-block"> <span class="muted">(0.20 = 20%)</span></td>${t.map(x=>`<td></td><td class="num amt">${fmt(x.filled?x.tax:null)}</td>`).join('')}${xCol?'<td class="no-print"></td>':''}</tr>`;
  html+=`<tr class="grand"><td colspan="5">TOTAL COST (THB)</td>${t.map((x,i)=>`<td></td><td class="num amt ${i===best&&M.fair?'best':''}">${fmt(x.filled?x.total:null)}</td>`).join('')}${xCol?'<td class="no-print"></td>':''}</tr>`;
  html+=`<tr><td colspan="5">Average Cost Per Unit (THB)</td>${t.map((x,i)=>`<td></td><td class="num amt ${i===best&&M.fair?'best':''}">${fmt(x.filled?x.avg:null,4)}</td>`).join('')}${xCol?'<td class="no-print"></td>':''}</tr>`;
  html+='</tfoot>';
  $('tbl').innerHTML=html;
}

function renderSummary(){
  const t=totals(), M=cmpMeta(t), best=M.best, nFilledOpt=t.filter(x=>x.filled).length;
  $('cmpWarn').innerHTML = (best>=0&&!M.fair)
    ? `<div class="warnbar"><span>⚠</span><span><b>ยอดต่ำสุดยังเทียบกันตรงๆ ไม่ได้</b> — "${esc(Q.options[best].label)||'ตัวเลือก '+(best+1)}" กรอกราคาไว้ ${t[best].filled} รายการ ขณะที่คอลัมน์ที่ครบที่สุดกรอก ${M.maxFilled} รายการ ยอดจึงต่ำกว่าโดยอัตโนมัติเพราะรายการที่ยังไม่กรอกไม่ถูกนับ ไม่ใช่เพราะไม่มีค่าใช้จ่าย — ขอราคาให้ครบทุกช่องก่อนตัดสินใจ · ถ้าช่องที่ว่างคือรายการที่ไม่มีค่าใช้จ่ายจริงในตัวเลือกนี้ ข้ามคำเตือนนี้ได้</span></div>`
    : '';
  $('summary').innerHTML=Q.options.map((o,i)=>{
    const short=t[i].filled>0&&t[i].filled<M.maxFilled?M.maxFilled-t[i].filled:0;
    const gap=i===best&&nFilledOpt>1?Math.min(...t.filter((x,j)=>j!==i&&x.filled).map(x=>x.total))-t[i].total:null;
    return `<div class="sum ${i===best?(M.fair?'best':'warn'):''}">
    <div class="t"><span>${esc(o.label)||'ตัวเลือก '+(i+1)}</span><span>${KIND_LABEL[o.kind]||''}${isFcl(o.kind)?' × '+(num(o.containers)||1)+' ตู้':''}</span></div>
    <div class="v">${t[i].filled?fmt(t[i].total,0)+' <span style="font-size:12px;font-weight:400">THB</span>':'<span class="muted">ยังไม่กรอกราคา</span>'}</div>
    <div class="s">${t[i].filled&&t[i].avg!=null?fmt(t[i].avg,4)+' THB / unit':''}${gap!=null?` · ประหยัดกว่าถัดไป ${fmt(gap,0)} THB`:''}</div>
    ${short?`<div class="s" style="color:var(--color-warn-text)">กรอกน้อยกว่าคอลัมน์ที่ครบที่สุด ${short} รายการ</div>`:''}
  </div>`;}).join('');
}

function renderToolbar(){
  document.querySelectorAll('#typeSeg button').forEach(b=>{
    const on=b.dataset.type===Q.type;
    b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on));
  });
  const sel=$('savedSel');
  sel.innerHTML='<option value="">— ใบเปรียบเทียบที่บันทึกไว้ ('+saved.length+') —</option>'+
    saved.slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).map(q=>{
      const tl=TEMPLATES[q.type]?.title.split('—').pop().trim()||q.type;
      return `<option value="${esc(q.id)}" ${q.id===Q.id?'selected':''}>${esc(q.head?.ref||'(ไม่มีเลขอ้างอิง)')} · ${esc(q.head?.party||'')} · ${tl} · ${esc((q.updatedAt||q.createdAt||'').slice(0,10))}</option>`;}).join('');
  if(!saved.some(q=>q.id===Q.id))sel.value='';
  $('btnDel').disabled=!saved.some(q=>q.id===Q.id);
  $('status').textContent=dirty?'● ยังไม่บันทึก':(Q.updatedAt?'บันทึกล่าสุด '+Q.updatedAt.replace('T',' ').slice(0,16):'ใบใหม่ (ยังไม่บันทึก)');
}
function renderAll(){ renderToolbar(); renderHead(); renderTable(); renderSummary(); }
function refreshCalc(){ renderTable(); renderSummary(); renderToolbar(); }

// ─── event wiring (delegation — DOM ถูก re-render บ่อย) ──────────────────────
function setPath(path,val){
  const parts=path.split('.'); let o=Q;
  // เดินตาม path แบบระวัง — แถว/คอลัมน์ที่เพิ่งถูกลบไปทำให้ input เก่ายิง event มาบน path ที่ไม่มีแล้ว
  // ถ้าไม่กันไว้จะ throw TypeError กลางคัน แล้ว handler ที่เหลือ (touch/render) ไม่ทำงานทั้งชุด
  for(let i=0;i<parts.length-1;i++){ o=o[parts[i]]; if(o==null||typeof o!=='object')return false; }
  o[parts[parts.length-1]]=val; return true;
}
function touch(){ dirty=true; try{localStorage.setItem(DRAFT_KEY,JSON.stringify(Q));}catch(e){} }

document.addEventListener('input',e=>{
  const p=e.target.dataset.p; if(!p)return;
  let v=e.target.value;
  if(e.target.type==='number'||p==='taxFactor')v=v===''?null:num(v);
  if(!setPath(p,v))return; touch();
  // ระหว่างพิมพ์ห้ามวาด DOM ใหม่เด็ดขาด (ช่องที่โฟกัสอยู่จะถูกแทนด้วยช่องใหม่ ค่าที่พิมพ์หาย/ไหลไปช่องอื่น
  // — เคยเกิดจริงตอนทดสอบ: ราคาไหลไปต่อท้าย Total Qty) → อัปเดตเฉพาะเซลล์ยอดเงิน/สรุปแบบ in-place เท่านั้น
  const affectsCalc = p.startsWith('rows.') || p==='taxFactor' || p.endsWith('.containers') || p.endsWith('.cw')
    || ['head.cbm','head.gw','head.vw','head.fx','head.qty'].includes(p);
  if(affectsCalc) updateAmountsInPlace();
  // ชื่อคอลัมน์ (forwarder) โผล่ในการ์ดสรุปและแถบเตือน จึงต้องวาดสรุปใหม่ · อัปเดต tooltip ในที่เดิม
  // ห้ามวาดตารางใหม่ เพราะช่องที่กำลังพิมพ์อยู่จะถูกแทนที่แล้วโฟกัสหลุด
  else if(p.startsWith('options.')&&p.endsWith('.label')){ e.target.title=v; renderSummary(); }
  else renderSummary();
  renderToolbar();
});
// วาดตารางใหม่เฉพาะเมื่อโครงตารางเปลี่ยนจริง (เลือกจาก <select>: ชนิดคอลัมน์ / หน่วยคิด / สกุลเงิน)
// — select ไม่ใช่การพิมพ์ จึงปลอดภัยที่จะ re-render หลังเลือก
document.addEventListener('change',e=>{
  const p=e.target.dataset.p; if(!p)return;
  if(e.target.tagName==='SELECT'){
    if(p.endsWith('.kind')){ const oi=+p.split('.')[1]; if(isFcl(Q.options[oi].kind)&&!Q.options[oi].containers)Q.options[oi].containers=1; }
    refreshCalc();
  }
  if(p==='head.ref')autofillFromPO(e.target.value);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.type){ switchType(b.dataset.type); return; }
  if(b.dataset.delopt!=null){ const oi=+b.dataset.delopt; if(Q.options.length<=1)return; if(!confirm('ลบคอลัมน์ "'+(Q.options[oi].label||'ตัวเลือก '+(oi+1))+'" ?'))return; Q.options.splice(oi,1); Q.rows.forEach(r=>r.prices.splice(oi,1)); touch(); renderAll(); return; }
  if(b.dataset.delrow!=null){ const ri=+b.dataset.delrow; Q.rows.splice(ri,1); touch(); refreshCalc(); return; }
  if(b.dataset.addrow!=null){ const sec=b.dataset.addrow; let last=-1; Q.rows.forEach((r,i)=>{if(r.section===sec)last=i;});
    Q.rows.splice(last+1,0,{id:uid(),section:sec,desc:'',basis:'flat',unit:'SHIP',cur:'THB',qty:1,tpl:false,prices:Q.options.map(()=>null)}); touch(); refreshCalc();
    const el=document.querySelector(`[data-p="rows.${last+1}.desc"]`); if(el)el.focus(); return; }
});
// อัปเดตเฉพาะเซลล์จำนวนเงิน/สรุป โดยไม่ re-render input ที่กำลังพิมพ์ (กัน cursor กระโดด)
function updateAmountsInPlace(){
  const rows=[...document.querySelectorAll('#tbl tbody tr:not(.sec)')];
  let ri=0;
  Q.rows.forEach((r,i)=>{ const tr=rows[ri++]; if(!tr)return; const cells=tr.querySelectorAll('td.amt');
    Q.options.forEach((o,oi)=>{ const a=amount(r,oi); if(!cells[oi])return; cells[oi].textContent=fmt(a);
      // tooltip แสดงวิธีคิด (จำนวน × ราคา × เรต) ต้องอัปเดตตามด้วย ไม่งั้นค้างค่าเดิมตั้งแต่ตอน render
      const q=qtyFor(r,o);
      cells[oi].title=a!=null?`${fmt(q,r.basis==='cbm'&&!isFcl(o.kind)?3:2)} × ${fmt(num(r.prices[oi]))}${r.cur==='USD'?' × '+fmt(num(Q.head.fx),4):''}`:''; }); });
  const t=totals(), M=cmpMeta(t), best=M.best;
  const foot=document.querySelectorAll('#tbl tfoot tr');
  const setRow=(tr,vals,d)=>{ if(!tr)return; const c=tr.querySelectorAll('td.amt'); vals.forEach((v,i)=>{ if(c[i]){c[i].textContent=fmt(v,d); c[i].classList.toggle('best',i===best&&v!=null&&M.fair);} }); };
  setRow(foot[0],t.map(x=>x.filled?x.sub:null)); setRow(foot[1],t.map(x=>x.filled?x.tax:null)); setRow(foot[2],t.map(x=>x.filled?x.total:null)); setRow(foot[3],t.map(x=>x.filled?x.avg:null),4);
  // ป้ายในหัวคอลัมน์ที่อิงค่าจาก head (× CBM / placeholder CW) ให้ตามค่าใหม่ด้วย
  document.querySelectorAll('#tbl thead tr:first-child th').forEach((th,i)=>{ const o=Q.options[i-5]; if(!o)return;
    const lbl=th.querySelector('.opt-head .lbl'); if(lbl&&o.kind==='lcl')lbl.textContent='× CBM '+fmt(num(Q.head.cbm),2);
    const cw=th.querySelector('input[data-p$=".cw"]'); if(cw)cw.placeholder=fmt(chargeableW(o),1); });
  document.querySelectorAll('#tbl thead .tag-best,#tbl thead .tag-warn').forEach(el=>el.remove());
  if(best>=0){ const th=document.querySelectorAll('#tbl thead tr:first-child th')[5+best]; const r=th&&th.querySelector('.opt-head .r:last-child'); if(r)r.insertAdjacentHTML('beforeend',bestTag(M.fair)); }
  renderSummary();
}

function switchType(type){
  if(type===Q.type)return;
  const hasData=Q.rows.some(r=>r.prices.some(p=>p!=null))||Q.head.ref||Q.options.some(o=>String(o.label||'').trim());
  if(hasData&&!confirm('เปลี่ยนแม่แบบจะเริ่มใบใหม่ (ใบปัจจุบันถ้ายังไม่บันทึกจะหาย) ดำเนินการต่อ?'))return;
  const keep={ref:Q.head.ref,party:Q.head.party,category:Q.head.category,group:Q.head.group,qty:Q.head.qty,fx:Q.head.fx,fxAsOf:Q.head.fxAsOf,cbm:Q.head.cbm,gw:Q.head.gw,vw:Q.head.vw};
  Q=newQuote(type); Object.assign(Q.head,keep); dirty=false; touch(); dirty=false; renderAll();
}

// ─── server I/O ──────────────────────────────────────────────────────────────
async function api(path,opts){ const r=await fetch(path,{headers:{'Content-Type':'application/json',Accept:'application/json'},...opts}); const j=await r.json().catch(()=>({})); if(!r.ok)throw new Error(j.error||('HTTP '+r.status)); return j; }
async function loadSaved(){ try{ const j=await api('/api/freight-quotes'); saved=j.rows||[]; }catch(e){ saved=[]; toast('โหลดรายการที่บันทึกไม่ได้: '+e.message,true); } renderToolbar(); }
async function saveQuote(){
  const T=TEMPLATES[Q.type];
  if(!Q.head.ref){ toast('กรอก '+T.refLabel+' ก่อนบันทึก',true); document.querySelector('[data-p="head.ref"]')?.focus(); return; }
  try{ const j=await api('/api/freight-quotes/upsert',{method:'POST',body:JSON.stringify(Q)}); Q.updatedAt=j.row.updatedAt; dirty=false; try{localStorage.removeItem(DRAFT_KEY);}catch(e){} await loadSaved(); toast('บันทึกแล้ว · '+Q.head.ref); }
  catch(e){ toast('บันทึกไม่สำเร็จ: '+e.message,true); }
}
async function deleteQuote(){
  if(!saved.some(q=>q.id===Q.id))return;
  if(!confirm('ลบใบเปรียบเทียบ "'+(Q.head.ref||Q.id)+'" ออกจาก server?'))return;
  try{ await api('/api/freight-quotes/delete',{method:'POST',body:JSON.stringify({id:Q.id})}); await loadSaved(); Q=newQuote(Q.type); dirty=false; renderAll(); toast('ลบแล้ว'); }
  catch(e){ toast('ลบไม่สำเร็จ: '+e.message,true); }
}
async function loadFx(force){
  try{ const j=await api('/api/fx-rates'+(force?'?force=1':'')); fxRates={}; (j.rows||[]).forEach(r=>{fxRates[r.currency]=r.thb_per_unit; fxRates[r.currency+'_asOf']=String(r.as_of||'').slice(0,10);}); }
  catch(e){ fxRates=null; }
}
// ตัวเลือกใน datalist มีเพดานไว้กันหน้าหน่วง แต่ถ้าตัดจริงต้องบอก ไม่ใช่ตัดเงียบ
// (กฎเดิมของโปรเจกต์: ห้ามตัดข้อมูลโดยไม่บอก — ผู้ใช้ที่พิมพ์ PO แล้วไม่ขึ้นจะนึกว่าไม่มี PO นั้น)
const DL_CAP_PO=3000, DL_CAP_VENDOR=3000;
async function loadLists(){
  const cut=[];
  try{ const j=await api('/api/import-pos'); pos=(j.rows||[]).map(r=>({po:r.po_number,supplier:r.supplier,cat:r.goods_category,qty:null})); }catch(e){ pos=[]; }
  try{ const j=await api('/api/vendors'); vendors=(j.rows||[]).map(r=>r.name).filter(Boolean); if(j.truncated)cut.push(`รายชื่อผู้ให้บริการจาก Odoo ถูกตัดที่ ${vendors.length} จาก ${j.total} ราย`); }catch(e){ vendors=[]; }
  let dl=$('poList'); if(!dl){dl=document.createElement('datalist');dl.id='poList';document.body.appendChild(dl);}
  dl.innerHTML=pos.slice(0,DL_CAP_PO).map(p=>`<option value="${esc(p.po)}">${esc(p.supplier||'')}</option>`).join('');
  if(pos.length>DL_CAP_PO)cut.push(`รายการ PO ในช่องแนะนำแสดง ${DL_CAP_PO} จาก ${pos.length} รายการ (พิมพ์เลขเต็มได้ตามปกติ)`);
  let vl=$('vendorList'); if(!vl){vl=document.createElement('datalist');vl.id='vendorList';document.body.appendChild(vl);}
  vl.innerHTML=vendors.slice(0,DL_CAP_VENDOR).map(v=>`<option value="${esc(v)}">`).join('');
  if(vendors.length>DL_CAP_VENDOR)cut.push(`รายชื่อผู้ให้บริการในช่องแนะนำแสดง ${DL_CAP_VENDOR} จาก ${vendors.length} ราย`);
  if(cut.length)toast('หมายเหตุ: '+cut.join(' · '),true);
}
function autofillFromPO(ref){
  const p=pos.find(x=>String(x.po).toUpperCase()===String(ref||'').trim().toUpperCase()); if(!p)return;
  // เติมค่าลงช่องตรงๆ ไม่ renderHead() — ผู้ใช้มักกด Tab ไปช่องถัดไปแล้วเริ่มพิมพ์ทันที ถ้าวาดใหม่ช่องนั้นจะหลุดโฟกัส
  let changed=false;
  const setIn=(key,val)=>{ Q.head[key]=val; const el=document.querySelector(`[data-p="head.${key}"]`); if(el)el.value=val; changed=true; };
  if(!Q.head.party&&p.supplier)setIn('party',p.supplier);
  if(!Q.head.category&&p.cat)setIn('category',p.cat);
  if(changed){touch();renderToolbar();toast('เติมข้อมูลจาก PO '+p.po);}
}

// ─── Excel export (โครงเดียวกับไฟล์ต้นฉบับ) ──────────────────────────────────
function exportXlsx(){
  if(!window.XLSX){toast('ไม่พบไลบรารี Excel (vendor/xlsx.full.min.js)',true);return;}
  const T=TEMPLATES[Q.type], t=totals(), h=Q.head, air=Q.type==='import-air', nOpt=Q.options.length;
  const aoa=[];
  aoa.push([T.title]); aoa.push(['Kiss of Beauty Co., Ltd. (Head Office)']); aoa.push([]);
  aoa.push(['SHIPMENT DETAILS']);
  aoa.push([T.refLabel,h.ref,'',T.partyLabel,h.party,'',Q.type==='export-sea'?'Incoterm':'Term',h.term]);
  aoa.push(['PO Category',h.category,'','Product Group',h.group,'','USD Exchange Rate',h.fx,'THB/USD (BOT)'+(h.fxAsOf?' '+h.fxAsOf:'')]);
  aoa.push(['Total Qty',h.qty,'','Document Ref.',h.docRef,'',air?'Gross Weight (GW)':'Measurement (CBM)',air?h.gw:h.cbm,air?'KGS':'CBM']);
  if(air)aoa.push(['','','','','','','Volume Weight (VW)',h.vw,'KGS']); else aoa.push(['','','','','','','Gross Weight (GW)',h.gw,'KGS']);
  aoa.push([]);
  const optHead=['No.','Description','Qty','Unit','Cur']; Q.options.forEach((o,oi)=>{const nm=String(o.label||'').trim()||('Option '+(oi+1));
    optHead.push(nm+(isFcl(o.kind)?` (${num(o.containers)||1} x ${KIND_LABEL[o.kind]})`:o.kind==='air'?` (CW ${fmt(chargeableW(o),1)} KGS)`:' (LCL)'),'Amount (THB)');});
  aoa.push(optHead);
  let n=0,cur=null;
  Q.rows.forEach(r=>{
    if(r.section!==cur){cur=r.section;aoa.push([cur]);}
    n++; const line=[n,r.desc,r.basis==='flat'?(r.qty??1):(r.basis==='cbm'?'CBM':'KGS'),r.unit,r.cur];
    Q.options.forEach((o,oi)=>{const p=num(r.prices[oi]),a=amount(r,oi);line.push(p==null?'':p,a==null?'':+a.toFixed(2));});
    aoa.push(line);
  });
  const foot=(label,vals)=>{const l=[label,'','','',''];vals.forEach(v=>l.push('',v==null?'':+v.toFixed(2)));aoa.push(l);};
  foot('SUBTOTAL',t.map(x=>x.filled?x.sub:null));
  foot('* As per receipt — factor '+(num(Q.taxFactor)??0),t.map(x=>x.filled?x.tax:null));
  foot('TOTAL COST (THB)',t.map(x=>x.filled?x.total:null));
  foot('Average Cost Per Unit',t.map(x=>x.filled?x.avg:null));
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:5},{wch:34},{wch:8},{wch:9},{wch:6}].concat(Q.options.flatMap(()=>[{wch:13},{wch:15}]));
  // ชื่อชีทและชื่อไฟล์ต้องผ่านตัวกรองคนละชุด — ชีทห้าม \ / ? * [ ] : · ไฟล์ห้าม < > : " / \ | ? * ด้วย
  const safeSheet=(h.ref||'Comparison').replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31)||'Comparison';
  const safeFile=String(h.ref||Q.type).replace(/[\\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().slice(0,80)||Q.type;
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,safeSheet);
  XLSX.writeFile(wb,`Freight Comparison - ${safeFile}.xlsx`);
}

// ─── misc ────────────────────────────────────────────────────────────────────
let toastT; function toast(msg,err){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',err?4500:2200); }
window.addEventListener('beforeunload',e=>{ if(dirty){e.preventDefault();e.returnValue='';} });

$('btnNew').onclick=()=>{ if(dirty&&!confirm('ใบปัจจุบันยังไม่บันทึก เริ่มใบใหม่?'))return; Q=newQuote(Q.type); dirty=false; try{localStorage.removeItem(DRAFT_KEY);}catch(e){} renderAll(); };
$('btnDup').onclick=()=>{ const c=JSON.parse(JSON.stringify(Q)); c.id=uid(); c.updatedAt=null; c.createdAt=new Date().toISOString().slice(0,10); c.head.ref=(c.head.ref||'')+' (copy)'; Q=c; dirty=true; touch(); renderAll(); toast('ทำสำเนาแล้ว — แก้เลขอ้างอิงแล้วบันทึก'); };
$('btnSave').onclick=saveQuote;
$('btnDel').onclick=deleteQuote;
$('btnXlsx').onclick=exportXlsx;
$('btnPrint').onclick=()=>window.print();
$('btnAddOpt').onclick=()=>{ if(Q.options.length>=6){toast('สูงสุด 6 คอลัมน์',true);return;} const air=Q.type==='import-air'; Q.options.push({label:'',kind:air?'air':'lcl',containers:1,cw:null}); Q.rows.forEach(r=>r.prices.push(null)); touch(); renderAll(); };
$('savedSel').onchange=e=>{ const id=e.target.value; if(!id)return; const q=saved.find(x=>x.id===id); if(!q)return; if(dirty&&!confirm('ใบปัจจุบันยังไม่บันทึก เปิดใบอื่นแทน?')){renderToolbar();return;} Q=normalizeQuote(JSON.parse(JSON.stringify(q))); dirty=false; renderAll(); };
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveQuote();} });

(async function init(){
  let draft=null; try{draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');}catch(e){}
  await loadFx(false);
  if(draft&&TEMPLATES[draft.type]&&Array.isArray(draft.rows)&&Array.isArray(draft.options)){ Q=normalizeQuote(draft); dirty=true; }
  else { Q=newQuote('import-sea'); }
  renderAll();
  loadSaved(); loadLists();
})();
</script>
